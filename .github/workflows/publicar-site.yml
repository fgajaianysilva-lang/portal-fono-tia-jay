name: Publicar Portal Fono

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Descompactar portal
        run: |
          mkdir -p public
          unzip -q portal-fono-tia-jay-login-v2.zip -d temporario
          cp -a temporario/portal-fono-tia-jay-login-v2/. public/
          touch public/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
